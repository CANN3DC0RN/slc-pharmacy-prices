name: Update prices

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch:          # "Run workflow" button for a manual refresh
  push:
    branches: [main]
    paths: ["partners/**", "stores.json", "config.json", "site/index.html", "site/style.css", "scraper/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect prices
        run: python3 scraper/run.py

      - name: Collect Utah cannabis news
        run: python3 scraper/news.py

      - name: Build reports, guides, pharmacy pages, news page and sitemap
        run: python3 scraper/build.py

      - name: Save data (keeps last good prices if a store fails next time)
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add site/data.json history site/reports site/news/news.json
          git diff --cached --quiet || git commit -m "Update prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
